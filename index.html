<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Classroom Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">CD</div>
        <div><strong>Classroom</strong><span>Management Dashboard</span></div>
      </div>
      <div class="class-label">CLASS WORKSPACE</div>
      <nav id="navigation" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav-item" data-page="announcements">▤ <span>Announcements</span></button>
        <button class="nav-item" data-page="calendar">▦ <span>Calendar</span></button>
        <button class="nav-item" data-page="assignments">✓ <span>Assignments</span></button>
        <button class="nav-item" data-page="grades">▥ <span>Grade Tracker</span></button>
        <button class="nav-item" data-page="directory">♙ <span>Class Directory</span></button>
        <button class="nav-item" data-page="attendance">◷ <span>Attendance</span></button>
        <button class="nav-item" data-page="governance">⚖ <span>Class Governance</span></button>
        <button class="nav-item" data-page="resources">▧ <span>Resources</span></button>
        <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span> Local workspace</div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="Toggle menu">☰</button>
        <div class="breadcrumb">Workspace <span>/</span> <strong id="pageCrumb">Dashboard</strong></div>
        <div class="top-actions">
          <span class="date-label" id="todayLabel"></span>
          <button class="icon-button" id="themeButton" title="Toggle theme" aria-label="Toggle theme">◐</button>
        </div>
      </header>
      <section class="page-content">
        <div class="page-heading">
          <div>
            <p class="eyebrow" id="welcomeEyebrow">CLASS WORKSPACE</p>
            <h1 id="pageTitle">Good day, Visionaries.</h1>
            <p class="muted" id="pageDescription">Your classroom information, organized in one place.</p>
          </div>
          <button class="primary-button" id="quickAddButton">＋ Quick add</button>
        </div>
        <div id="pageRoot"></div>
        <footer>Classroom Dashboard <span>•</span> Starter prototype</footer>
      </section>
    </main>
  </div>
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-heading"><h2 id="modalTitle">Add item</h2><button id="closeModal" class="icon-button" aria-label="Close">×</button></div>
      <form id="itemForm">
        <label for="itemTitle">Title</label>
        <input id="itemTitle" name="title" required maxlength="120" placeholder="Enter a title">
        <label for="itemDetails">Details</label>
        <textarea id="itemDetails" name="details" rows="3" placeholder="Add useful details (optional)"></textarea>
        <div id="extraFields"></div>
        <div class="modal-actions"><button type="button" class="secondary-button" id="cancelModal">Cancel</button><button type="submit" class="primary-button">Save item</button></div>
      </form>
    </section>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
