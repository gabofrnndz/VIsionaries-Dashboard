<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Dashboard</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="logo">CD</span><div><b>Classroom</b><small>Management Dashboard</small></div></div>
  <p class="nav-label">CLASS WORKSPACE</p>
  <nav id="nav">
    <button data-page="dashboard" class="active">⌂ <span>Dashboard</span></button>
    <button data-page="announcements">▤ <span>Announcements</span></button>
    <button data-page="calendar">▦ <span>Monthly Calendar</span></button>
    <button data-page="assignments">✓ <span>Assignments</span></button>
    <button data-page="governance">⚖ <span>Class Governance</span></button>
    <button data-page="resources">▧ <span>Resources</span></button>
    <button data-page="settings">⚙ <span>Settings & Backup</span></button>
  </nav>
  <div class="side-foot">● Local workspace</div>
</aside>
<main>
<header class="topbar"><button id="menu" class="menu">☰</button><div class="crumb">Workspace / <b id="crumb">Dashboard</b></div><div id="today"></div><button id="theme" class="outline">◐</button></header>
<section class="content">
  <div class="heading"><div><p class="eyebrow">CLASS WORKSPACE</p><h1 id="title">Good day, Visionaries.</h1><p id="desc" class="muted">Your classroom information, organized in one place.</p></div></div>
  <div id="root"></div>
  <footer>Classroom Dashboard · Prototype</footer>
</section>
</main></div>
<div class="backdrop hidden" id="backdrop"><section class="modal"><div class="modal-head"><h2 id="modalTitle">Add item</h2><button id="close" class="outline">×</button></div><form id="form"><label>Title<input name="title" id="fieldTitle" required maxlength="140"></label><label>Details / instructions<textarea name="details" id="fieldDetails" rows="3"></textarea></label><div id="fields"></div><div class="form-actions"><button type="button" id="cancel" class="outline">Cancel</button><button class="primary">Save</button></div></form></section></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body></html>
